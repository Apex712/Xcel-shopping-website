<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <title>Xcel International Resources | Considered goods, fair value</title>
  <meta name="description" content="Explore quality goods from Xcel International Resources. Shop with confidence and make an offer on selected items.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #faf9f6;
      --surface: #fff;
      --ink: #22251f;
      --muted: #77796f;
      --line: #e9e7df;
      --gold: #a77b2f;
      --gold-light: #e7d9b8;
      --green: #526c52;
      --red: #a94f43;
      --shadow: 0 16px 48px rgba(32, 34, 28, .11);
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'DM Sans', 'Segoe UI', sans-serif;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --paper: #191b18;
      --surface: #222520;
      --ink: #f0eee7;
      --muted: #aaa99e;
      --line: #393c34;
      --gold: #d2aa65;
      --gold-light: #5b4a2d;
      --green: #9bb597;
      --red: #e29184;
      --shadow: 0 16px 48px rgba(0, 0, 0, .3);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55; transition: background .2s, color .2s; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    .wrap { width: min(1240px, calc(100% - 64px)); margin-inline: auto; }
    .announcement { background: #25271f; color: #f8f5eb; text-align: center; padding: 8px 16px; font-size: 11px; letter-spacing: .5px; }
    .announcement span { color: #e3c88f; }
    .site-header { position: sticky; z-index: 20; top: 0; background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
    .header-inner { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 28px; }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 228px; }
    .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--gold); color: var(--gold); font-family: var(--serif); font-size: 20px; }
    .brand-name { font-size: 11px; line-height: 1.25; font-weight: 700; letter-spacing: 1.05px; text-transform: uppercase; }
    .brand-name small { display: block; color: var(--muted); font-size: 9px; font-weight: 500; letter-spacing: 1.55px; margin-top: 4px; }
    .main-nav { display: flex; align-items: center; gap: 30px; margin-right: auto; }
    .nav-link { padding: 27px 0; color: var(--muted); background: none; border: 0; font-size: 12px; }
    .nav-link:hover, .nav-link.active { color: var(--ink); }
    .header-actions { display: flex; align-items: center; gap: 9px; }
    .icon-button { width: 38px; height: 38px; display: inline-grid; place-items: center; border: 1px solid transparent; border-radius: 50%; background: none; color: var(--ink); position: relative; }
    .icon-button:hover { border-color: var(--line); background: var(--surface); }
    .cart-count { position: absolute; top: -2px; right: -1px; display: grid; place-items: center; min-width: 17px; height: 17px; padding-inline: 4px; border-radius: 20px; background: var(--gold); color: white; font-size: 9px; }
    .button { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 0 17px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-size: 11px; font-weight: 600; letter-spacing: .2px; transition: .18s ease; }
    .button:hover { opacity: .88; transform: translateY(-1px); }
    .button-outline { color: var(--ink); background: transparent; border-color: var(--line); }
    .button-gold { color: #fff; border-color: var(--gold); background: var(--gold); }
    .button-small { min-height: 35px; padding-inline: 13px; font-size: 10px; }
    .button:disabled { cursor: not-allowed; opacity: .46; transform: none; }
    .text-button { border: 0; background: none; color: var(--gold); padding: 7px 0; font-size: 11px; font-weight: 600; }
    .hero { min-height: 490px; display: grid; grid-template-columns: 1fr 1fr; background: #ece9e1; overflow: hidden; }
    .hero-copy { align-self: center; padding: 64px max(48px, calc((100vw - 1240px) / 2)); padding-right: 44px; }
    .eyebrow { color: var(--gold); text-transform: uppercase; font-weight: 700; letter-spacing: 1.8px; font-size: 9px; }
    .hero h1 { max-width: 500px; margin: 16px 0; color: #25271f; font: 600 clamp(40px, 5vw, 66px)/1.07 var(--serif); letter-spacing: 0; }
    .hero-copy p { max-width: 390px; margin: 0 0 25px; color: #6c6e64; font-size: 13px; }
    .hero-actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .hero-photo { min-height: 490px; background: #b3a997 url('https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1400&q=85') center 53%/cover no-repeat; position: relative; }
    .hero-photo::after { position: absolute; inset: 0; content: ''; background: linear-gradient(90deg, rgba(32,32,27,.08), transparent 35%); }
    .hero-caption { position: absolute; z-index: 1; right: 25px; bottom: 24px; padding: 10px 14px; color: white; background: rgba(34,36,30,.6); font-size: 9px; letter-spacing: .5px; }
    .trust-row { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); background: var(--surface); }
    .trust-item { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 19px 10px; color: var(--muted); font-size: 10px; }
    .trust-item + .trust-item { border-left: 1px solid var(--line); }
    .trust-mark { color: var(--gold); font: 18px var(--serif); }
    .section { padding: 64px 0; }
    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 27px; }
    .section-heading h2 { margin: 5px 0 0; font: 500 31px/1.15 var(--serif); letter-spacing: 0; }
    .section-heading p { max-width: 340px; margin: 0; color: var(--muted); font-size: 11px; }
    .category-row { display: flex; align-items: center; gap: 8px; margin-bottom: 23px; overflow-x: auto; scrollbar-width: none; }
    .category-row::-webkit-scrollbar { display: none; }
    .category-chip { flex: 0 0 auto; padding: 8px 14px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 10px; }
    .category-chip.active, .category-chip:hover { color: var(--ink); border-color: var(--gold); background: color-mix(in srgb, var(--gold) 8%, var(--surface)); }
    .catalog-tools { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 22px; }
    .search-field { width: min(320px, 100%); position: relative; }
    .search-field input { width: 100%; height: 40px; padding: 0 14px 0 38px; border: 1px solid var(--line); outline: 0; color: var(--ink); background: var(--surface); font-size: 11px; }
    .search-field input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); outline: 1px solid var(--gold); }
    .search-glyph { position: absolute; left: 13px; top: 11px; color: var(--muted); }
    .result-count { color: var(--muted); font-size: 10px; }
    .product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 17px; }
    .product-card { min-width: 0; cursor: pointer; }
    .product-image-wrap { position: relative; overflow: hidden; aspect-ratio: 4 / 4.65; background: #e7e3d9; }
    .product-image { width: 100%; height: 100%; object-fit: cover; transition: transform .45s ease; }
    .product-card:hover .product-image { transform: scale(1.035); }
    .product-label { position: absolute; top: 12px; left: 12px; padding: 6px 8px; background: var(--paper); color: var(--ink); font-size: 8px; text-transform: uppercase; letter-spacing: .5px; }
    .product-label.offer-label { left: auto; right: 12px; background: #f0e6d2; color: #725520; }
    .product-info { padding: 12px 2px 0; }
    .product-category { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .9px; }
    .product-title-line { display: flex; align-items: start; justify-content: space-between; gap: 7px; margin-top: 3px; }
    .product-title { margin: 0; font: 500 16px/1.35 var(--serif); letter-spacing: 0; }
    .stock-dot { flex: 0 0 auto; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: var(--green); }
    .stock-dot.low { background: #b58c43; }
    .stock-dot.out { background: var(--red); }
    .price-line { display: flex; justify-content: space-between; gap: 8px; margin-top: 7px; font-size: 11px; }
    .price-line strong { font-weight: 600; }
    .negotiable-note { color: var(--gold); font-size: 9px; }
    .empty-state { grid-column: 1/-1; text-align: center; padding: 50px 20px; color: var(--muted); border: 1px dashed var(--line); }
    .editorial-band { display: grid; grid-template-columns: 1fr 1fr; min-height: 300px; background: #e8e4da; }
    .editorial-image { background: #c9c1b3 url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1100&q=85') center/cover; }
    .editorial-copy { align-self: center; max-width: 530px; padding: 50px 11%; }
    .editorial-copy h2 { margin: 10px 0; color: #292a23; font: 500 33px/1.2 var(--serif); }
    .editorial-copy p { margin-bottom: 20px; color: #6b6d64; font-size: 11px; }
    .footer { background: #22241e; color: #eae8df; padding: 36px 0; }
    .footer-inner { display: flex; justify-content: space-between; gap: 20px; align-items: center; }
    .footer .brand-name small, .footer-muted { color: #aaa99e; }
    .footer-note { max-width: 350px; color: #aaa99e; font-size: 10px; }
    .page-shell { min-height: 65vh; padding: 49px 0 78px; }
    .page-title { margin: 0 0 24px; font: 500 36px/1.2 var(--serif); letter-spacing: 0; }
    .breadcrumb { margin-bottom: 13px; color: var(--muted); font-size: 10px; }
    .detail-layout { display: grid; grid-template-columns: 1.05fr .95fr; gap: 8%; align-items: start; }
    .detail-photo { width: 100%; aspect-ratio: 1/1.02; object-fit: cover; background: var(--line); }
    .detail-copy { padding-top: 14px; }
    .detail-copy h1 { margin: 8px 0 12px; font: 500 39px/1.15 var(--serif); letter-spacing: 0; }
    .detail-price { margin: 15px 0 4px; font-size: 19px; font-weight: 600; }
    .detail-minimum { margin-bottom: 18px; color: var(--gold); font-size: 11px; }
    .detail-description { max-width: 490px; color: var(--muted); font-size: 12px; }
    .detail-stock { margin: 19px 0; font-size: 10px; }
    .detail-stock strong { color: var(--green); }
    .detail-stock strong.low { color: #b58c43; }
    .detail-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 18px; }
    .qty-control { height: 42px; display: inline-flex; border: 1px solid var(--line); background: var(--surface); }
    .qty-control button { width: 37px; border: 0; background: none; color: var(--ink); }
    .qty-control span { width: 32px; display: grid; place-items: center; font-size: 11px; }
    .spec-list { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; max-width: 470px; padding-top: 19px; margin-top: 24px; border-top: 1px solid var(--line); }
    .spec-item { color: var(--muted); font-size: 9px; }
    .spec-item strong { display: block; margin-top: 3px; color: var(--ink); font-size: 10px; font-weight: 500; }
    .cart-layout { display: grid; grid-template-columns: 1fr 320px; gap: 55px; align-items: start; }
    .cart-line { display: grid; grid-template-columns: 96px 1fr auto; gap: 17px; align-items: center; padding: 17px 0; border-bottom: 1px solid var(--line); }
    .cart-line img { width: 96px; height: 100px; object-fit: cover; background: var(--line); }
    .cart-line h3 { margin: 0 0 3px; font: 500 18px var(--serif); }
    .cart-line p { margin: 0; color: var(--muted); font-size: 10px; }
    .cart-price { text-align: right; font-size: 12px; }
    .cart-qty { display: flex; align-items: center; gap: 9px; margin-top: 9px; }
    .cart-qty button { width: 25px; height: 25px; border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
    .cart-qty span { min-width: 12px; text-align: center; font-size: 10px; }
    .remove-button { margin-left: 7px; border: 0 !important; color: var(--muted) !important; background: none !important; text-decoration: underline; font-size: 9px; }
    .summary { padding: 20px; background: var(--surface); border: 1px solid var(--line); }
    .summary h2 { margin: 0 0 17px; font: 500 21px var(--serif); }
    .summary-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; color: var(--muted); font-size: 10px; }
    .summary-total { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--ink); font-size: 13px; }
    .summary .button { width: 100%; margin-top: 13px; }
    .muted-note { color: var(--muted); font-size: 9px; }
    .checkout-layout { display: grid; grid-template-columns: 1fr 370px; gap: 44px; align-items: start; }
    .signin-shell { width: min(440px, 100%); margin: 24px auto 0; padding: 31px; border: 1px solid var(--line); background: var(--surface); }
    .signin-shell h1 { margin: 8px 0; font: 500 32px/1.2 var(--serif); }
    .signin-shell > p { margin: 0 0 22px; color: var(--muted); font-size: 11px; }
    .signin-shell .field + .field { margin-top: 13px; }
    .signin-shell .button { width: 100%; margin-top: 20px; }
    .google-button { display: flex; width: 100%; align-items: center; justify-content: center; gap: 11px; margin-top: 20px; }
    .google-mark { display: grid; width: 18px; height: 18px; place-items: center; border-radius: 50%; color: #4285f4; background: #fff; font: 700 13px Arial, sans-serif; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1/-1; }
    .field label { color: var(--muted); font-size: 9px; }
    .field input, .field select, .field textarea { min-width: 0; height: 42px; padding: 0 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); outline: 0; font-size: 11px; }
    .field textarea { min-height: 78px; padding-top: 10px; resize: vertical; }
    .notice { margin: 17px 0; padding: 13px; border-left: 2px solid var(--gold); background: color-mix(in srgb, var(--gold) 8%, var(--surface)); color: var(--muted); font-size: 10px; }
    .admin-tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
    .admin-tab { padding: 11px 15px; border: 0; border-bottom: 2px solid transparent; color: var(--muted); background: none; font-size: 10px; }
    .admin-tab.active { color: var(--ink); border-bottom-color: var(--gold); }
    .admin-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
    .stat { padding: 17px; border: 1px solid var(--line); background: var(--surface); }
    .stat-label { color: var(--muted); font-size: 9px; }
    .stat-value { margin-top: 6px; font: 500 25px var(--serif); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); }
    table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
    th { padding: 12px 13px; color: var(--muted); background: color-mix(in srgb, var(--paper) 60%, var(--surface)); font-size: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .7px; }
    td { padding: 12px 13px; border-top: 1px solid var(--line); font-size: 10px; }
    .table-actions { display: flex; gap: 8px; }
    .table-action { border: 0; padding: 0; color: var(--gold); background: none; font-size: 9px; }
    .status { display: inline-block; padding: 4px 7px; color: var(--green); background: color-mix(in srgb, var(--green) 12%, var(--surface)); font-size: 8px; }
    .status.rejected { color: var(--red); background: color-mix(in srgb, var(--red) 12%, var(--surface)); }
    .status.pending { color: #a47c35; background: #f3ead7; }
    .admin-heading { display: flex; justify-content: space-between; gap: 15px; align-items: center; margin: 0 0 13px; }
    .admin-heading h2 { margin: 0; font: 500 21px var(--serif); }
    .modal-backdrop { position: fixed; z-index: 50; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(24,25,22,.58); animation: fade-in .15s ease-out; }
    .modal { position: relative; width: min(530px, 100%); max-height: min(88vh, 760px); overflow: auto; padding: 27px; background: var(--surface); box-shadow: var(--shadow); animation: rise-in .2s ease-out; }
    .modal.wide { width: min(680px, 100%); }
    .modal-close { position: absolute; top: 12px; right: 12px; width: 33px; height: 33px; border: 1px solid var(--line); color: var(--ink); background: var(--surface); font-size: 17px; }
    .modal h2 { margin: 0 32px 7px 0; font: 500 25px var(--serif); }
    .modal > p { margin: 0 0 18px; color: var(--muted); font-size: 10px; }
    .modal form .button { margin-top: 18px; }
    .offer-result { margin-top: 15px; padding: 13px; border-left: 2px solid var(--green); background: color-mix(in srgb, var(--green) 10%, var(--surface)); font-size: 11px; }
    .offer-result.rejected { border-color: var(--red); background: color-mix(in srgb, var(--red) 8%, var(--surface)); }
    .toast { position: fixed; z-index: 80; right: 22px; bottom: 20px; max-width: min(360px, calc(100vw - 40px)); padding: 13px 17px; color: white; background: #25271f; box-shadow: var(--shadow); font-size: 11px; animation: rise-in .18s ease-out; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 900px) {
      .wrap { width: min(100% - 40px, 760px); }
      .main-nav { gap: 18px; }
      .brand { min-width: 195px; }
      .hero-copy { padding-left: 40px; }
      .product-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .detail-layout { gap: 5%; }
      .cart-layout { grid-template-columns: 1fr 280px; gap: 24px; }
      .checkout-layout { grid-template-columns: 1fr 300px; gap: 25px; }
    }
    @media (max-width: 650px) {
      .wrap { width: calc(100% - 32px); }
      .announcement { font-size: 9px; }
      .header-inner { min-height: 65px; gap: 6px; }
      .brand { min-width: 0; gap: 8px; }
      .brand-mark { width: 33px; height: 33px; font-size: 18px; }
      .brand-name { font-size: 9px; letter-spacing: .6px; }
      .brand-name small { font-size: 7px; letter-spacing: 1.15px; }
      .main-nav { display: none; }
      .header-actions { gap: 1px; }
      .header-actions .admin-shortcut { display: none; }
      .icon-button { width: 35px; height: 35px; }
      .hero { grid-template-columns: 1fr; }
      .hero-copy { padding: 48px 24px 38px; }
      .hero h1 { max-width: 430px; font-size: 44px; }
      .hero-photo { min-height: 265px; }
      .trust-item { flex-direction: column; gap: 5px; padding: 14px 6px; text-align: center; font-size: 8px; }
      .trust-mark { font-size: 16px; }
      .section { padding: 43px 0; }
      .section-heading { align-items: start; flex-direction: column; margin-bottom: 20px; }
      .section-heading h2 { font-size: 27px; }
      .section-heading p { font-size: 10px; }
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 19px 11px; }
      .product-image-wrap { aspect-ratio: 4 / 4.8; }
      .product-info { padding-top: 8px; }
      .product-title { font-size: 14px; }
      .product-category { font-size: 8px; }
      .product-label { top: 8px; left: 8px; padding: 5px 6px; font-size: 7px; }
      .product-label.offer-label { right: 7px; }
      .catalog-tools { align-items: start; flex-direction: column; }
      .search-field { width: 100%; }
      .editorial-band { grid-template-columns: 1fr; }
      .editorial-image { min-height: 210px; }
      .editorial-copy { padding: 35px 24px; }
      .editorial-copy h2 { font-size: 28px; }
      .footer-inner { align-items: start; flex-direction: column; }
      .page-shell { padding: 32px 0 55px; }
      .page-title { font-size: 30px; }
      .detail-layout { grid-template-columns: 1fr; gap: 12px; }
      .detail-photo { aspect-ratio: 1/1; }
      .detail-copy h1 { font-size: 32px; }
      .detail-copy { padding-top: 4px; }
      .detail-actions .button { flex: 1; }
      .cart-layout, .checkout-layout { grid-template-columns: 1fr; gap: 22px; }
      .cart-line { grid-template-columns: 75px 1fr auto; gap: 10px; }
      .cart-line img { width: 75px; height: 82px; }
      .cart-line h3 { font-size: 15px; }
      .cart-price { font-size: 10px; }
      .admin-stats { grid-template-columns: repeat(2, 1fr); }
      .admin-tab { padding-inline: 10px; font-size: 9px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .modal { padding: 23px 18px; }
      .signin-shell { padding: 24px 18px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (() => {
      const STORAGE_KEY = 'xcel-store-v1';
      const categories = ['Home & Living', 'Electronics', 'Fashion', 'Office'];

el for="product-minimum">Minimum acceptable price (₦)</label><input id="product-minimum" name="minimumPrice" type="number" min="0" step="1" value="${product?.minimumPrice ?? ''}"></div><div class="field full"><label for="product-description">Description</label><textarea id="product-description" name="description" required>${escapeHtml(product?.description || '')}</textarea></div><div class="field full"><label for="product-image">Image URL</label><input id="product-image" name="image" type="url" required value="${escapeHtml(product?.image || '')}"></div></div><button class="button button-gold" type="submit">${product ? 'Save changes' : 'Add product'}</button></form></section></div>`;
      };
      const offerModal = product => `<div class="modal-backdrop" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="offer-title"><button class="modal-close" data-action="close-modal" aria-label="Close">×</button><h2 id="offer-title">Make an offer</h2><p>${escapeHtml(product.name)} · Current price ${money(product.price)} · Accepted from ${money(product.minimumPrice)}</p><form id="offer-form" data-sku="${escapeHtml(product.sku)}"><div class="form-grid"><div class="field full"><label for="offer-name">Your name</label><input id="offer-name" name="name" required autocomplete="name"></div><div class="field full"><label for="offer-email">Email address</label><input id="offer-email" name="email" type="email" required autocomplete="email"></div><div class="field full"><label for="offer-amount">Your offer (₦)</label><input id="offer-amount" name="amount" type="number" min="1" step="1" required placeholder="e.g. ${product.minimumPrice}"></div></div><div id="offer-result"></div><button class="button button-gold" type="submit">Submit offer</button></form></section></div>`;
      const render = () => {
        const theme = localStorage.getItem('xcel-theme') || 'light';
        document.documentElement.dataset.theme = theme;
        app.innerHTML = `${header()}${view === 'home' || view === 'catalog' ? storefront() : view === 'detail' ? (findProduct(selectedSku) ? detailPage(findProduct(selectedSku)) : storefront()) : view === 'cart' ? cartPage() : view === 'checkout' ? checkoutPage() : view === 'signin' ? signinPage() : adminPage()}${footer()}${modal === 'product' ? productFormModal() : modal === 'offer' && findProduct(selectedSku) ? offerModal(findProduct(selectedSku)) : ''}`;
      };
      const go = nextView => { view = nextView; if (nextView !== 'detail') selectedSku = null; modal = ''; window.scrollTo({ top: 0, behavior: 'smooth' }); render(); };
      const addToCart = (sku, quantity = 1, unitPrice, offerId = null) => {
        const product = findProduct(sku);
        if (!product || product.active === false || product.stock < 1) return toast('This item is currently out of stock.');
        const existing = data.cart.find(item => item.sku === sku);
        const requested = (existing?.quantity || 0) + quantity;
        if (requested > product.stock) return toast(`Only ${product.stock} available. Please adjust the quantity.`);
        if (existing && unitPrice !== undefined) { existing.quantity = requested; existing.unitPrice = unitPrice; existing.offerId = offerId; }
        else if (existing) existing.quantity = requested;
        else data.cart.push({ sku, quantity, unitPrice: unitPrice ?? product.price, offerId });
        save(); render(); toast(`${product.name} added to your bag.`);
      };
      const evaluateOffer = (product, amount) => amount >= product.minimumPrice ? 'accepted' : 'rejected';
      const submitOrder = customer => {
        for (const item of data.cart) {
          const product = findProduct(item.sku);
          if (!product || product.active === false || item.quantity > product.stock) throw new Error(`${product?.name || item.sku} no longer has enough stock. Please update your bag.`);
        }
        const order = { id: `XIR-${Date.now().toString().slice(-7)}`, createdAt: new Date().toISOString().slice(0, 10), customer, items: data.cart.map(item => ({ sku: item.sku, name: findProduct(item.sku).name, quantity: item.quantity, unitPrice: item.unitPrice })), total: cartTotal(), status: 'Order received · payment to arrange' };
        data.cart.forEach(item => { const product = findProduct(item.sku); product.stock -= item.quantity; product.updatedAt = new Date().toISOString().slice(0, 10); });
        data.orders.push(order); data.cart = []; save(); return order;
      };
      document.addEventListener('click', event => {
        const productCardElement = event.target.closest('[data-product]');
        if (productCardElement && !event.target.closest('button')) { selectedSku = productCardElement.dataset.product; detailQuantity = 1; go('detail'); return; }
        const viewButton = event.target.closest('[data-view]');
        if (viewButton) { const target = viewButton.dataset.view; if (viewButton.dataset.category) categoryFilter = viewButton.dataset.category; go(target); if (target === 'catalog') document.querySelector('#collection')?.scrollIntoView({ behavior: 'smooth' }); return; }
        const category = event.target.closest('[data-category]');
        if (category) { categoryFilter = category.dataset.category; view = 'catalog'; render(); document.querySelector('#collection')?.scrollIntoView({ behavior: 'smooth' }); return; }
        const tab = event.target.closest('[data-admin-tab]');
        if (tab) { adminTab = tab.dataset.adminTab; render(); return; }
        const action = event.target.closest('[data-action]');
        if (!action) return;
        const sku = action.dataset.sku;
        switch (action.dataset.action) {
          case 'theme': localStorage.setItem('xcel-theme', document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); render(); break;
          case 'signout': fetch('/auth/logout', { method: 'POST', credentials: 'same-origin' }).then(refreshCustomerSession).then(() => toast('You have signed out.')).catch(() => toast('Could not sign out. Please try again.')); break;
          case 'detail-qty': { const product = findProduct(selectedSku); detailQuantity = Math.max(1, Math.min(product.stock, detailQuantity + Number(action.dataset.delta))); render(); break; }
          case 'detail-add': addToCart(selectedSku, detailQuantity); break;
          case 'make-offer': modal = 'offer'; render(); break;
          case 'cart-qty': { const item = data.cart.find(line => line.sku === sku); const product = findProduct(sku); const quantity = item.quantity + Number(action.dataset.delta); if (quantity < 1) data.cart = data.cart.filter(line => line.sku !== sku); else if (quantity <= product.stock) item.quantity = quantity; else return toast(`Only ${product.stock} available.`); save(); render(); break; }
          case 'remove-cart': data.cart = data.cart.filter(line => line.sku !== sku); save(); render(); break;
          case 'new-product': editingSku = null; modal = 'product'; render(); break;
          case 'edit-product': editingSku = sku; modal = 'product'; render(); break;
          case 'toggle-product': { const product = findProduct(sku); product.active = product.active === false; product.updatedAt = new Date().toISOString().slice(0, 10); save(); render(); toast(`Product ${product.active ? 'activated' : 'deactivated'}.`); break; }
          case 'remove-product': { if (confirm(`Permanently remove ${findProduct(sku)?.name || 'this product'}?`)) { data.products = data.products.filter(product => product.sku !== sku); data.cart = data.cart.filter(item => item.sku !== sku); save(); render(); } break; }
          case 'cart-offer': { const offer = data.offers.find(item => item.id === action.dataset.offerId); if (offer?.status === 'accepted') { modal = ''; addToCart(offer.sku, 1, offer.amount, offer.id); } break; }
          case 'close-modal': modal = ''; render(); break;
          case 'backdrop': if (event.target === action) { modal = ''; render(); } break;
        }
      });
      document.addEventListener('input', event => {
        if (event.target.id === 'product-search') {
          searchTerm = event.target.value;
          const grid = document.querySelector('#product-grid'); if (grid) grid.innerHTML = productsBlock(filteredProducts());
          const count = document.querySelector('.result-count'); if (count) count.textContent = `${filteredProducts().length} ${filteredProducts().length === 1 ? 'piece' : 'pieces'}`;
        }
        if (event.target.id === 'product-negotiable') document.querySelector('#minimum-field').hidden = event.target.value !== 'true';
        if (event.target.id === 'product-category') document.querySelector('#custom-category-field').hidden = event.target.value !== '__custom';
      });
      document.addEventListener('submit', event => {
        if (event.target.id === 'offer-form') {
          event.preventDefault();
          const product = findProduct(event.target.dataset.sku); const form = new FormData(event.target);
          const amount = Number(form.get('amount')); const status = evaluateOffer(product, amount);
          const offer = { id: `offer-${Date.now()}`, sku: product.sku, name: String(form.get('name')).trim(), email: String(form.get('email')).trim(), amount, minimumPrice: product.minimumPrice, status, createdAt: new Date().toISOString().slice(0, 10) };
          data.offers.push(offer); save();
          const result = document.querySelector('#offer-result');
          if (status === 'accepted') result.innerHTML = `<div class="offer-result">Offer accepted. ${money(amount)} is yours for this item. <button class="button button-small button-gold" type="button" data-action="cart-offer" data-offer-id="${offer.id}">Add to bag at ${money(amount)}</button></div>`;
          else result.innerHTML = `<div class="offer-result rejected">This offer is below the minimum of ${money(product.minimumPrice)}. Please submit an offer at or above the minimum.</div>`;
          event.target.querySelector('[type="submit"]').hidden = true;
        }
        if (event.target.id === 'product-form') {
          event.preventDefault(); const form = new FormData(event.target); const current = editingSku ? findProduct(editingSku) : null;
          const sku = String(form.get('sku')).trim();
          if (!current && findProduct(sku)) return toast('That SKU is already in use.');
          const negotiable = form.get('negotiable') === 'true'; const price = Number(form.get('price')); const minimumPrice = negotiable ? Number(form.get('minimumPrice')) : 0;
          if (negotiable && (!minimumPrice || minimumPrice > price)) return toast('Minimum offer must be greater than zero and no higher than the current price.');
          const category = form.get('category') === '__custom' ? String(form.get('customCategory')).trim() : String(form.get('category'));
          if (!category) return toast('Enter a category.');
          const product = { sku, name: String(form.get('name')).trim(), category, price, minimumPrice, stock: Number(form.get('stock')), negotiable, description: String(form.get('description')).trim(), image: String(form.get('image')).trim(), addedAt: current?.addedAt || new Date().toISOString().slice(0, 10), updatedAt: new Date().toISOString().slice(0, 10), active: current?.active !== false };
          if (current) data.products[data.products.indexOf(current)] = product; else data.products.push(product);
          save(); modal = ''; render(); toast(current ? 'Product updated.' : 'Product added.');
        }
        if (event.target.id === 'checkout-form') {
          event.preventDefault(); const values = new FormData(event.target); const customer = { name: String(values.get('name')).trim(), email: String(values.get('email')).trim(), phone: String(values.get('phone')).trim(), city: String(values.get('city')).trim(), address: String(values.get('address')).trim() };
          try { const order = submitOrder(customer); view = 'admin'; adminTab = 'orders'; render(); toast(`Order ${order.id} received. Our team will contact you to arrange payment and delivery.`); }
          catch (error) { toast(error.message); }
        }
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && modal) { modal = ''; render(); }
        if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.product-card')) { event.preventDefault(); selectedSku = event.target.dataset.product; detailQuantity = 1; go('detail'); }
      });
      render();
      refreshCustomerSession();
    })();
  </script>
</body>
